plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

def infoFile = file("src/main/java/fun/enoughvisuals/Info.java")
def infoVersionMatcher = infoFile.text =~ /VERSION\s*=\s*"([^"]+)"/
if (!infoVersionMatcher.find()) {
    throw new GradleException("Could not read Info.VERSION from ${infoFile}")
}

version = infoVersionMatcher.group(1)
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "enoughvisuals" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            ideConfigGenerated = true
            runDir "run"
            vmArg "-Dfile.encoding=UTF-8"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// JitPack publishes the v1.0.5 tag as the root artifact (the README's
// multi-module coordinate currently has no published POM).
def funtimeEventsSdk = "com.github.Rizzener:FunTimeEventsSDK:v1.0.5"
def discordPresence = "com.github.CrashSystemZ:jDRPC:v1.0.0"
def pulseCosmeticsRuntimeJar = file("libs/pulse-cosmetics-local-1.21.4.jar")
def mcefRuntimeJar = file("libs/mcef.jar")

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation funtimeEventsSdk
    include funtimeEventsSdk
    implementation discordPresence
    include discordPresence
    modRuntimeOnly files(
            "cosmetic-build/fabric/build/libs/cosmetic-0.1.5+1.21.4-fabric-mc.jar")
    modRuntimeOnly files(pulseCosmeticsRuntimeJar)
    compileOnly files(pulseCosmeticsRuntimeJar)
    modRuntimeOnly files(mcefRuntimeJar)
    compileOnly files(mcefRuntimeJar)
    runtimeOnly "com.github.FiguraMC.luaj:luaj-core:3.0.8-figura"
    runtimeOnly "com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura"
    runtimeOnly "com.neovisionaries:nv-websocket-client:2.14"
    // Minecraft ships JNA at runtime; it is only needed to compile the WinRT
    // availability probe and must not be bundled into the mod.
    compileOnly "net.java.dev.jna:jna-platform:5.15.0"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.main.java.exclude "fun/wounsee/cosmetic/**"
// Resource inputs are declared explicitly in processResources below.
sourceSets.main.resources.setSrcDirs([])

def cosmeticRuntimeDir = file("cosmetic-build")
def embeddedCosmeticJar = file(
        "cosmetic-build/fabric/build/libs/cosmetic-0.1.5+1.21.4-fabric-mc.jar")

tasks.register("buildEmbeddedCosmetic", Exec) {
    inputs.dir("src/main/java/fun/wounsee/cosmetic")
    inputs.dir("cosmetic-build/common/src/main/resources")
    inputs.dir("cosmetic-build/fabric/src/main/resources")
    inputs.files(
            "cosmetic-build/build.gradle",
            "cosmetic-build/common/build.gradle",
            "cosmetic-build/fabric/build.gradle",
            "cosmetic-build/gradle.properties",
            "cosmetic-build/settings.gradle")
    outputs.file(embeddedCosmeticJar)
    workingDir cosmeticRuntimeDir
    // The nested gradlew.bat needs JAVA_HOME; org.gradle.java.home from
    // gradle.properties is not inherited by forked processes.
    environment "JAVA_HOME", System.getProperty("java.home")
    commandLine new File(cosmeticRuntimeDir, "gradlew.bat"), ":fabric:remapJar", "--no-daemon"
}

tasks.named("buildEmbeddedCosmetic").configure {
    // The nested Gradle build owns its own incremental state. Always let it
    // inspect the shared cosmetic sources so an updated bridge cannot leave an
    // older embedded jar beside freshly compiled EnoughVisuals classes.
    outputs.upToDateWhen { false }
}

tasks.matching { it.name == "runClient" || it.name == "generateRemapClasspath" }.configureEach {
    dependsOn tasks.named("buildEmbeddedCosmetic")
}

processResources {
    dependsOn tasks.named("buildEmbeddedCosmetic")
    from("src/main/resources") {
        exclude "META-INF/jars/**"
    }
    from(embeddedCosmeticJar) {
        into "META-INF/jars"
        rename { "cosmetic.jar" }
    }
    from(pulseCosmeticsRuntimeJar) {
        into "META-INF/jars"
        rename { "pulse-cosmetics.jar" }
    }
    from(mcefRuntimeJar) {
        into "META-INF/jars"
        rename { "mcef.jar" }
    }
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "mod_name": "EnoughVisuals",
                "mod_description": "EnoughVisuals - ${project.minecraft_version}"
    }
}

tasks.register("auditFontAssets", Exec) {
    group = "verification"
    description = "Verifies generated Inter, Solar and Figma HUD MTSDF atlases"
    inputs.dir("scripts/font-assets")
    inputs.dir("src/main/resources/assets/enough/fonts/msdf")
    inputs.files(
            "src/main/java/fun/enoughvisuals/utils/font/SolarIcons.java",
            "src/main/java/fun/enoughvisuals/utils/font/HudIcons.java")
    commandLine "python", file("scripts/font-assets/audit_font_assets.py")
}

tasks.named("check") {
    dependsOn tasks.named("auditFontAssets")
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    // MCEF starts its downloader before client entrypoints and before mixins on
    // com.cinemamod.mcef.MCEF are guaranteed to be applied. Loaders that expose
    // only the outer mod manifest, not the nested mcef.jar manifest, still need
    // the pinned java-cef revision, so keep it on the outer artifact as well.
    manifest {
        attributes "java-cef-commit": "eaeb3d4370aa3526ee237ad1981ad59af3de4dd1"
    }
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("libs/fte-api-1.0.5-LICENSE.txt") {
        into "META-INF/licenses"
        rename { "FunTimeEventsSDK-LICENSE.txt" }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}
